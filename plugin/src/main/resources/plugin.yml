name: inhGraphics
version: '1.0.0'
main: ru.khozain.inhgraphics.InhGraphicsPlugin
api-version: '1.21'
author: Khozain
description: 'Персональные погода, время, прорисовка и туман для отдельных игроков'
commands:
  igtime:
    description: 'Персональное время суток для игрока'
    usage: '/igtime <day|night|noon|midnight|<тики>|reset> [ник]'
    permission: inhgraphics.admin
  igweather:
    description: 'Персональная погода для игрока'
    usage: '/igweather <clear|rain|thunder|reset> [ник]'
    permission: inhgraphics.admin
  igrender:
    description: 'Персональная дальность прорисовки для игрока'
    usage: '/igrender <2-32|reset> [ник]'
    permission: inhgraphics.admin
  igfog:
    description: 'Персональный туман из частиц'
    usage: '/igfog <on|off|density 1-10> [ник]'
    permission: inhgraphics.admin
  igreset:
    description: 'Полный сброс персональных настроек'
    usage: '/igreset <ник|all>'
    permission: inhgraphics.admin
permissions:
  inhgraphics.admin:
    description: 'Управление индивидуальной графикой игроков'
    default: op
